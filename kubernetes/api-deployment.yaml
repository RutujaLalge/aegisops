apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-api
  namespace: aegisops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegisops-api
  template:
    metadata:
      labels:
        app: aegisops-api
    spec:
      serviceAccountName: aegisops-api
      containers:
        - name: api
          image: REPLACE_WITH_ECR/aegisops-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aegisops-api
  namespace: aegisops
spec:
  selector:
    app: aegisops-api
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
